name: Update snow data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      test_alert:
        description: "Send a test powder alert to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw app icons (first run only)
        run: |
          if [ ! -f icons/icon-512.png ]; then pip install --quiet pillow && python3 scripts/make_icons.py; fi
      - name: Fetch data
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_INCHES: ${{ vars.ALERT_INCHES }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: node scripts/fetch-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add data.json icons
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update snow data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
