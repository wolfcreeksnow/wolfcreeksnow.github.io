name: Update snow data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data
        run: node scripts/fetch-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update snow data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
